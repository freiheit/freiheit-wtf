name: Build and Deploy to Fastmail

on:
  push:
    branches:
      - "**"
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Deploy even if content unchanged"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.154.2"
          extended: true

      - name: Build
        run: hugo --minify --logLevel debug --destination public

      - name: List directory contents
        run: ls -la public

      - name: Persist build
        uses: actions/upload-artifact@v7
        with:
          name: website
          path: public

  deploy-prep:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}

    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          path: website
          name: website

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Create rclone.conf
        run: |
          echo "[webdav]
          type = webdav
          url = ${{ secrets.WEBDAV_URL }}
          vendor = fastmail
          user = ${{ secrets.WEBDAV_USERNAME }}
          pass = ${{ secrets.WEBDAV_PASSWORD }}" > rclone.conf

      # --download compares actual bytes; webdav size/modtime comparison is
      # unreliable because every build refreshes mtimes
      - name: Detect content changes
        id: check
        run: |
          if rclone --config rclone.conf check --download ./website webdav:${{ secrets.WEBDAV_PATH }}; then
            echo "No content changes since last deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Content changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cleanup
        run: rm rclone.conf

  deploy-fastmail:
    needs: deploy-prep
    if: needs.deploy-prep.outputs.changed == 'true' || inputs.force_deploy == true
    runs-on: ubuntu-latest

    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          path: website
          name: website

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Create rclone.conf
        run: |
          echo "[webdav]
          type = webdav
          url = ${{ secrets.WEBDAV_URL }}
          vendor = fastmail
          user = ${{ secrets.WEBDAV_USERNAME }}
          pass = ${{ secrets.WEBDAV_PASSWORD }}" > rclone.conf

      - name: Backup remote directory
        run: |
          mkdir backup
          rclone --config rclone.conf sync webdav:${{ secrets.WEBDAV_PATH }} backup

      - name: Persist backup
        uses: actions/upload-artifact@v7
        with:
          name: backup
          path: backup

      - name: Deploy to WebDAV with rclone
        run: |
          rclone --config rclone.conf sync ./website webdav:${{ secrets.WEBDAV_PATH }}

      - name: Failover
        if: failure()
        run: |
          echo "rclone failed. Restoring original website files."
          rclone --config rclone.conf copy backup webdav:${{ secrets.WEBDAV_PATH }}

      - name: Cleanup
        if: always()
        run: rm -f rclone.conf

  deploy-gh-pages:
    needs: deploy-prep
    if: needs.deploy-prep.outputs.changed == 'true' || inputs.force_deploy == true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          path: website
          name: website

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  fastlycache:
    needs: [deploy-fastmail, deploy-gh-pages]
    # run if EITHER deploy target succeeded; one broken target must not
    # block purging the other's fresh content
    if: ${{ !cancelled() && (needs.deploy-fastmail.result == 'success' || needs.deploy-gh-pages.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Soft purge Fastly cache
        env:
          FASTLY_API_TOKEN: ${{ secrets.FASTLY_API_TOKEN }}
        run: |
          curl -sf -X POST \
            -H "Fastly-Key: $FASTLY_API_TOKEN" \
            -H "Fastly-Soft-Purge: 1" \
            "https://api.fastly.com/service/${{ secrets.FASTLY_SERVICE_ID }}/purge/everything"

      - name: Re-warm cache
        run: |
          for url in https://freiheit.wtf/ https://freiheit.wtf/styles.css https://freiheit.wtf/bundle.min.js; do
            curl -s -o /dev/null -w "%{http_code} $url\n" "$url"
          done
